spring.application.name=relectures

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/relectures}
spring.datasource.username=${DB_USER:relectures}
spring.datasource.password=${DB_PASSWORD:relectures}

# B5 : le schema vient uniquement de Flyway, Hibernate ne fait que verifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# RG3 : 12.5 doit etre refuse, pas tronque en 12
spring.jackson.deserialization.accept-float-as-int=false

# B4 : toutes les erreurs passent par GlobalExceptionHandler
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false
server.port=8081