# ENF5 : tests sur H2 en memoire, aucune base locale necessaire
spring.datasource.url=jdbc:h2:mem:relectures;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
server.port=8081