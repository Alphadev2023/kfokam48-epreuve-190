services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relectures
      POSTGRES_USER: relectures
      POSTGRES_PASSWORD: relectures
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relectures -d relectures"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/relectures
      DB_USER: relectures
      DB_PASSWORD: relectures
      SPRING_PROFILES_ACTIVE: demo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
